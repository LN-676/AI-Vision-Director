[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "AI-Vision-Director"
version = "3.0.0b2"
description = "AI vision direction, vehicle tracking, and digital reframing tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics==8.4.64",
    "filterpy==1.4.5",
    "mss==10.2.0",
    "opencv-python==4.13.0.92",
    "pillow==12.2.0",
    "yt-dlp>=2024.8.6",
    "onnx>=1.21.0",
    "onnxruntime>=1.26.0",
    "websockets>=13.0,<17.0",
    "PySide6>=6.8,<7.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "firebase-admin>=7.0,<8.0",
]

[project.optional-dependencies]
benchmark = [
    "pycocotools>=2.0.7",
]
api-test = [
    "httpx>=0.27,<1.0",
]
integration-test = [
    "httpx>=0.27,<1.0",
]

[project.scripts]
ai-vision-director = "autocamtracker.main:main"
ai-vision-director-qt = "autocamtracker.qt_main:main"
gid-loss-benchmark = "autocamtracker.evaluation.gid_loss:main"
model-benchmark = "autocamtracker.evaluation.vision_benchmark:main"
ai-vision-director-api = "autocamtracker.api.main:main"
ai-vision-director-import = "autocamtracker.cloud.importer:main"
ai-vision-director-sync = "autocamtracker.cloud.edge_outbox:main"
ai-vision-director-public-api = "autocamtracker.api.public_main:main"
cloud-benchmark-worker = "autocamtracker.cloud.benchmark_worker:main"
ai-vision-director-edge-agent = "autocamtracker.edge_control.agent:main"

[tool.setuptools.packages.find]
where = ["src"]
