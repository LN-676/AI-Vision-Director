name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime library
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Install package and test dependency
        run: python -m pip install --disable-pip-version-check -e '.[api-test]'
      - name: Run unit tests
        run: python -m unittest discover -s tests

  swift:
    name: Swift package tests
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ios/DockKitTester
    steps:
      - uses: actions/checkout@v6
      - name: Run Swift tests
        run: swift test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan Git history without printing secret values
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
